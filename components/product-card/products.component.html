<h2>Products</h2>

<div class="product-grid">
  <app-product-card
    *ngFor="let product of products"
    [product]="product">
  </app-product-card>
</div>
<h2>Cart</h2>

<div *ngFor="let item of cartItems">
  <p>Product ID: {{ item.product_id }}</p>
  <p>Quantity: {{ item.quantity }}</p>

  <button (click)="remove(item.id)">Remove</button>
</div>
