<h2>Products</h2>

<div *ngFor="let product of products">
  <h3>{{ product.name }}</h3>
  <p>Price: ₹{{ product.price }}</p>
</div>
<h2>Products</h2>

<div *ngIf="loading">Loading products...</div>
<div *ngIf="error">{{ error }}</div>

<div class="product-grid" *ngIf="!loading && !error">
  <app-product-card
    *ngFor="let product of products"
    [product]="product">
  </app-product-card>
</div>
